<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#030104" />
    <script>
      // Theme before first paint (Settings → Appearance): light, dark, or the device's.
      try {
        var p = localStorage.getItem("wr.theme") || "dark";
        var light = p === "light" || (p === "system" && window.matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
        if (light) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f2efe7");
      } catch (e) {}
    </script>
    <title>Wrangler Review</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/icon-256.png" />
    <!-- Link previews (C8). A share link gets its own tags from the Cloudflare Worker; these are the fallback. -->
    <meta property="og:site_name" content="Wrangler Review" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Wrangler Review" />
    <meta property="og:description" content="Video review by Wrangler Productions." />
    <meta property="og:image" content="https://review.wranglerportal.com/brand/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
