name: Preview (Phase 1)

# Oct 29: builds the phase2 branch (phase1-backend until Phase 1 went live) against the DEVELOPMENT backend (a copy of live data) and serves it at
# preview.wranglerportal.com behind a password page (infra/cloudflare-preview). Live is never touched.
# Before deploying it sets two settings on dev: EMAIL_ONLY_TO (email goes only to Heston's addresses; everyone else's is
# held) and SITE_URL (links in emails point at the preview). The repo is public, so nothing here prints values.
# Needs: CONVEX_DEV_DEPLOY_KEY, CLOUDFLARE_API_TOKEN (secrets); CLOUDFLARE_ACCOUNT_ID, BUNNY_CDN_HOST and, optionally,
# PREVIEW_EMAILS (variables; comma-separated, default heston@wranglerproductions.com).
on:
  push:
    branches: [phase2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  preview:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_BUNNY_CDN_HOST: ${{ vars.BUNNY_CDN_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Copy the email key and the Bunny playback keys from live to dev (values never printed)
        # Heston, Oct 29: "yes copy the keys". Live is only read here (env get); dev is written. Only what playback and
        # sending need: no Bunny API, upload or storage keys (dev can't change or delete anything in Bunny), and nothing
        # for Dropbox, Stripe or Slack. The email key is copied only once dev's email is locked to Heston (EMAIL_ONLY_TO).
        env:
          LIVE_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          DEV_KEY: ${{ secrets.CONVEX_DEV_DEPLOY_KEY }}
          PREVIEW_EMAILS: ${{ vars.PREVIEW_EMAILS }}
        run: |
          fix() { local k="${1//%7C/|}"; echo "${k//%7c/|}"; }
          LIVE_KEY="$(fix "$LIVE_KEY")"; DEV_KEY="$(fix "$DEV_KEY")"
          case "$LIVE_KEY" in prod:*) ;; *) echo "Live key missing or not a production key; nothing copied"; exit 0;; esac
          case "$DEV_KEY" in dev:*) ;; *) echo "Refused: not a development key"; exit 1;; esac
          # Lock email first, so the email key never lands on an unlocked dev.
          CONVEX_DEPLOY_KEY="$DEV_KEY" npx convex env set EMAIL_ONLY_TO "${PREVIEW_EMAILS:-heston@wranglerproductions.com}" > /dev/null || exit 1
          [ -n "$(CONVEX_DEPLOY_KEY="$DEV_KEY" npx convex env get EMAIL_ONLY_TO 2>/dev/null)" ] || { echo "EMAIL_ONLY_TO isn't set on dev; nothing copied"; exit 1; }
          copied=0; same=0; missing=0
          for n in RESEND_API_KEY \
                   BUNNY_STREAM_CDN BUNNY_STREAM_TOKEN_KEY BUNNY_STREAM_LIBRARY_ID \
                   BUNNY_STILLS_CDN BUNNY_STILLS_TOKEN_KEY \
                   BUNNY_SCRUB_CDN BUNNY_SCRUB_TOKEN_KEY BUNNY_SCRUB_LIBRARY_ID \
                   BUNNY_REVIEW_CDN BUNNY_REVIEW_TOKEN_KEY; do
            v="$(CONVEX_DEPLOY_KEY="$LIVE_KEY" npx convex env get "$n" 2>/dev/null)" || v=""
            if [ -z "$v" ]; then missing=$((missing+1)); echo "$n: not on live"; continue; fi
            echo "::add-mask::$v"
            cur="$(CONVEX_DEPLOY_KEY="$DEV_KEY" npx convex env get "$n" 2>/dev/null)" || cur=""
            if [ "$cur" = "$v" ]; then same=$((same+1)); echo "$n: already on dev"; continue; fi
            CONVEX_DEPLOY_KEY="$DEV_KEY" npx convex env set "$n" -- "$v" > /dev/null 2>&1 && { copied=$((copied+1)); echo "$n: copied"; } || echo "$n: couldn't set"
          done
          unset v cur
          echo "copied $copied, already there $same, not on live $missing"
      - name: Lock dev's email to Heston, point its links at the preview, deploy the backend to dev, build the site
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEV_DEPLOY_KEY }}
          PREVIEW_EMAILS: ${{ vars.PREVIEW_EMAILS }}
        run: |
          export CONVEX_DEPLOY_KEY="${CONVEX_DEPLOY_KEY//%7C/|}"
          export CONVEX_DEPLOY_KEY="${CONVEX_DEPLOY_KEY//%7c/|}"
          case "$CONVEX_DEPLOY_KEY" in dev:*) echo "key: development";; "") echo "CONVEX_DEV_DEPLOY_KEY is not set"; exit 1;; *) echo "Refused: not a development key"; exit 1;; esac
          emails="${PREVIEW_EMAILS:-heston@wranglerproductions.com}"
          npx convex env set EMAIL_ONLY_TO "$emails" > /dev/null && echo "EMAIL_ONLY_TO set"
          npx convex env set SITE_URL "https://preview.wranglerportal.com" > /dev/null && echo "SITE_URL set"
          echo "Settings on dev (names only):"; npx convex env list 2>/dev/null | cut -d= -f1 | sort | tr '\n' ' '; echo
          # The owner list: the restore can leave it empty; Heston is the owner (his address is already in the code).
          if [ -z "$(npx convex env get ALLOWED_EMAILS 2>/dev/null)" ]; then npx convex env set ALLOWED_EMAILS "heston@wranglerproductions.com" > /dev/null && echo "ALLOWED_EMAILS set"; else echo "ALLOWED_EMAILS: present"; fi
          # Sign-in needs a key pair on dev (JWT_PRIVATE_KEY + JWKS). The restore from backup left JWKS missing, so make a
          # fresh pair when it's absent. Dev only; never printed. Existing dev sign-ins end, which is fine on a copy.
          if ! npx convex env get JWKS > /dev/null 2>&1 || [ -z "$(npx convex env get JWKS 2>/dev/null)" ]; then
            node -e '
              const { generateKeyPairSync } = require("crypto");
              const { privateKey, publicKey } = generateKeyPairSync("rsa", { modulusLength: 2048 });
              const pem = privateKey.export({ type: "pkcs8", format: "pem" }).trimEnd().replace(/\n/g, " ");
              const jwk = publicKey.export({ format: "jwk" });
              require("fs").writeFileSync(process.env.RUNNER_TEMP + "/k", pem);
              require("fs").writeFileSync(process.env.RUNNER_TEMP + "/j", JSON.stringify({ keys: [{ use: "sig", alg: "RS256", ...jwk }] }));'
            npx convex env set JWT_PRIVATE_KEY -- "$(cat "$RUNNER_TEMP/k")" > /dev/null && npx convex env set JWKS -- "$(cat "$RUNNER_TEMP/j")" > /dev/null && echo "sign-in keys made on dev"
            rm -f "$RUNNER_TEMP/k" "$RUNNER_TEMP/j"
          else echo "sign-in keys: present"; fi
          npx convex deploy -y > /dev/null 2>&1 || npx convex dev --once --typecheck disable
          name="${CONVEX_DEPLOY_KEY#dev:}"; name="${name%%|*}"
          VITE_CONVEX_URL="https://${name}.convex.cloud" npm run build
          echo "built: $(ls dist | wc -l) files"
      - name: Deploy the preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: infra/cloudflare-preview
        run: npx --yes wrangler@4 deploy
      - name: Check it answers with the password page
        run: |
          sleep 15
          code=$(curl -s -o /dev/null -w '%{http_code}' https://preview.wranglerportal.com/)
          echo "preview.wranglerportal.com answered $code (401 = password page, 503 = no password set yet)"
          [ "$code" = "401" ] || [ "$code" = "503" ]
