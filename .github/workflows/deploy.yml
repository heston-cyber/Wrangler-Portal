name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Phase 0 (Oct 28): every test must pass before anything deploys.
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      # Public value (not a secret): Bunny's video CDN host name.
      VITE_BUNNY_CDN_HOST: ${{ vars.BUNNY_CDN_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the deploy key's shape (never prints it)
        if: ${{ env.CONVEX_DEPLOY_KEY != '' }}
        run: |
          k="${CONVEX_DEPLOY_KEY//%7C/|}"; k="${k//%7c/|}"
          echo "length: ${#k}"
          case "$k" in prod:*) echo "starts with prod: yes";; *) echo "starts with prod: no";; esac
          case "$k" in *"|"*) echo "contains |: yes";; *) echo "contains |: no";; esac
          case "$k" in *[[:space:]]*) echo "contains spaces or line breaks: yes";; *) echo "contains spaces or line breaks: no";; esac
          case "$k" in \"*|\'*) echo "starts with a quote: yes";; *) echo "starts with a quote: no";; esac
      - name: Deploy the backend, then build the site against it
        if: ${{ env.CONVEX_DEPLOY_KEY != '' }}
        run: |
          # Some copy paths turn the key's "|" into "%7C". A real key never contains "%7C", so undo it.
          export CONVEX_DEPLOY_KEY="${CONVEX_DEPLOY_KEY//%7C/|}"
          export CONVEX_DEPLOY_KEY="${CONVEX_DEPLOY_KEY//%7c/|}"
          npx convex deploy --cmd 'npm run build' --cmd-url-env-var-name VITE_CONVEX_URL
      - name: Build the site only (no backend key yet)
        if: ${{ env.CONVEX_DEPLOY_KEY == '' }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
